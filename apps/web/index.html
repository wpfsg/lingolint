<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Review app translations before they ship. Drop locale JSON files, find missing keys, broken placeholders and untranslated strings, fix them and export. Runs entirely in your browser."
    />
    <title>LingoLint</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237d95ff'/%3E%3Cstop offset='1' stop-color='%233f5fe6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 15h24a7 7 0 0 1 7 7v14a7 7 0 0 1-7 7H26l-7.5 6.2c-1.1.9-2.5.1-2.5-1.2V22a7 7 0 0 1 4-7z' fill='%23fff'/%3E%3Crect x='21' y='22' width='22' height='4' rx='2' fill='%23a9bdff'/%3E%3Crect x='21' y='30' width='14' height='4' rx='2' fill='%233f5fe6'/%3E%3Cpath d='M21 38.5c1.6-1.8 3.2-1.8 4.8 0s3.2 1.8 4.8 0 3.2-1.8 4.8 0' fill='none' stroke='%23f0625f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('lingolint-theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
