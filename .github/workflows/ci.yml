name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run build

      - run: npm run build:web

      - run: npm test

      # Dogfood: the example project must scan and the exit code must reflect
      # its deliberate errors (1), never a crash (2).
      - name: Scan example project
        run: |
          set +e
          node packages/cli/dist/bin.js scan ./examples/basic --source en
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 from the example scan, got $code"
            exit 1
          fi
