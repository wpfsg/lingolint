name: Release

# Creates a GitHub Release whenever a version tag is pushed. The release notes
# are the matching section of CHANGELOG.md, so keep the changelog current and
# release with:
#
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
          {
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "npx lingolint@$version scan ./locales --source en"
            echo '```'
            echo ""
            echo "Or try it in the browser: https://wpfsg.github.io/lingolint/"
          } >> notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LingoLint $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
