name: Deploy web UI

# Publishes apps/web to GitHub Pages on every push to main.
#
# One-time setup: in the repository settings, under Pages, set the source to
# "GitHub Actions". The site is then served from
# https://<owner>.github.io/<repo>/ and the base path below must match.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project sites live under /<repo>/, so Vite needs that as its base path.
      # Switch to "/" if you move to a custom domain or a user site.
      - name: Build web UI
        run: npm run build --workspace apps/web -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
