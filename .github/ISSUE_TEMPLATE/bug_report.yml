name: Bug report
description: Something is wrong, crashes, or reports an issue it should not (or misses one it should).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do not paste private or unreleased product text; reduce the example to a few generic strings that reproduce the behaviour.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command you ran and the output (use `--no-color`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal locale files
      description: The smallest `en.json` / `xx.json` pair that reproduces it.
      render: json
  - type: input
    id: version
    attributes:
      label: LingoLint version
      description: Output of `npx lingolint --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.4.0 on macOS 15
  - type: checkboxes
    id: kind
    attributes:
      label: Kind of problem
      options:
        - label: False positive (reported something that is fine)
        - label: False negative (missed a real problem)
        - label: Crash or wrong exit code
        - label: Configuration or CLI usability
